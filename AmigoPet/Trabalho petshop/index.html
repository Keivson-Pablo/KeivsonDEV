<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Amigo Pet</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <p class="marca">🐾 Amigo Pet <span>Sistema de Pet Shop</span></p>
  </header>

  <main>
    <section class="cartao cartao-login">
      <h1>Entrar</h1>
      <p class="dica">Tela demonstrativa: use dados fictícios. Nada é armazenado.</p>

      <form action="cadastro.html">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="atendente@amigopet.com" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite uma senha fictícia" autocomplete="off" required>

        <button type="submit" class="botao botao-cheio">Entrar</button>
        <a href="#conta" class="botao-link">Criar conta</a>
        <p id="conta" class="aviso">Criação de conta indisponível nesta versão demonstrativa.</p>
      </form>
    </section>
  </main>

  <footer>
    <p>Projeto Integrador · Informática para Internet</p>
    <p>Integrantes: ________________ e ________________</p>
  </footer>

</body>
</html>
